name: Set up the Xcode project
description: Select Xcode, install XcodeGen and xcbeautify, and generate Browser.xcodeproj.
inputs:
  xcode:
    description: Path to the Xcode app to use.
    default: /Applications/Xcode_26.6.app
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        sudo xcode-select -s "${{ inputs.xcode }}"
        xcodebuild -version
    - name: Install XcodeGen and xcbeautify
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        command -v xcodegen > /dev/null || brew install xcodegen
        command -v xcbeautify > /dev/null || brew install xcbeautify
        xcodegen --version
    - name: Generate project
      shell: bash
      run: xcodegen generate
