name: IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Archive
        run: |
          xcodebuild archive -project Browser.xcodeproj -scheme Browser -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Browser.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee archive.log | xcbeautify --renderer github-actions

      - name: Package IPA
        run: bash scripts/package_ipa.sh build/Browser.xcarchive out "Browser-$VERSION"

      - name: Default-browser probe IPA
        run: bash scripts/make_probe_ipa.sh out/Payload/Browser.app out "BrowserProbe-$VERSION"

      - name: Collect dSYMs
        run: (cd build/Browser.xcarchive && zip -qry "../../out/Browser-$VERSION-dSYMs.zip" dSYMs)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Browser-${{ env.VERSION }}
          path: |
            out/*.ipa
            out/*-dSYMs.zip

      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_nightly.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" out/*.ipa "out/Browser-$VERSION-dSYMs.zip" \
            --title "Browser $VERSION" "${notes_args[@]}"

      - name: Error summary
        if: failure()
        run: bash scripts/error_summary.sh archive.log
