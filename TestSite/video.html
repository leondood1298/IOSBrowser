<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video test page</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 40px; }
    video { display: block; width: 480px; height: 270px; background: #000; margin: 16px 0; }
  </style>
</head>
<body>
  <h1>Video test page</h1>
  <video id="clip" src="/media/sample.mp4" playsinline muted preload="metadata"></video>
  <p>A video file, a video played through Media Source, and a sound.</p>
  <p><a id="download-mkv" href="/media/sample.mkv?download=1">Download sample.mkv</a></p>
  <video id="stream" playsinline muted></video>
  <audio id="sound" src="/generated/tone.wav" preload="none"></audio>
  <script>
    // Video fed through Media Source has a blob: address, as on YouTube.
    if (window.MediaSource) {
      document.getElementById("stream").src = URL.createObjectURL(new MediaSource());
    }
  </script>
</body>
</html>
