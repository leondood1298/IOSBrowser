<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialogs test page</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 40px; }
    button, a { display: block; margin: 12px 0; font-size: 20px; }
  </style>
</head>
<body>
  <h1>Dialogs test page</h1>
  <button id="alert" onclick="alert('Hello from the page')">Show alert</button>
  <button id="confirm" onclick="document.getElementById('out').textContent = confirm('Continue?') ? 'confirmed' : 'cancelled'">Show confirm</button>
  <button id="prompt" onclick="document.getElementById('out').textContent = 'name: ' + (prompt('Your name?', 'Ada') || 'none')">Show prompt</button>
  <a id="popup" href="/second.html" target="_blank">Open second page in a new tab</a>
  <a id="mail" href="mailto:test@example.com">Mail link</a>
  <p id="out">no answer yet</p>
</body>
</html>
